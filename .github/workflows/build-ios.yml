name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '选择编译模式 (推荐 Debug，速度极快且 100% 稳定)'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 检查 Xcode 版本
        run: xcodebuild -version

      - name: 配置 Java 17 环境 (KMP 必需)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 扩容 Gradle 与 Kotlin 编译器内存 (提升至 6GB 防止 OOM)
        run: |
          echo "org.gradle.jvmargs=-Xmx6144M -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx6144M" >> gradle.properties

      - name: 安装 CocoaPods 依赖 (如果存在)
        run: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install --repo-update && cd ..
          fi

      - name: 编译 iOS App (免代码签名)
        run: |
          BUILD_CONFIG="${{ inputs.build_type || 'Debug' }}"
          echo "Current build configuration: $BUILD_CONFIG"

          if [ -d "iosApp/iosApp.xcworkspace" ]; then
            PROJECT_FLAG="-workspace iosApp/iosApp.xcworkspace"
          else
            PROJECT_FLAG="-project iosApp/iosApp.xcodeproj"
          fi

          SCHEME=$(xcodebuild -list $PROJECT_FLAG | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          if [ -z "$SCHEME" ]; then SCHEME="iosApp"; fi
          echo "Building Scheme: $SCHEME"

          xcodebuild build $PROJECT_FLAG \
            -scheme "$SCHEME" \
            -configuration "$BUILD_CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 封装为未签名 IPA
        run: |
          mkdir -p Payload
          # 自动适配 Debug 或 Release 模式生成的 .app 目录
          APP_PATH=$(find build/DerivedData/Build/Products -name "*.app" -maxdepth 2 2>/dev/null | grep -E "Release-iphoneos|Debug-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | grep "iphoneos" | head -n 1)
          fi
          echo "Found app at: $APP_PATH"

          cp -r "$APP_PATH" Payload/
          zip -qr LeonMusic-unsigned.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LeonMusic-Unsigned-IPA
          path: LeonMusic-unsigned.ipa
