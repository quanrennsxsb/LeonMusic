name: Build iOS Unsigned IPA

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build-ios:
    runs-on: macos-14 # 使用 Apple Silicon M1 环境编译，速度更快

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Java 17 环境 (KMP 必需)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 安装 CocoaPods 依赖 (如果存在)
        run: |
          if [ -f "iosApp/Podfile" ]; then
            cd iosApp && pod install --repo-update && cd ..
          fi

      - name: 编译 iOS Release App (免签名)
        run: |
          if [ -d "iosApp/iosApp.xcworkspace" ]; then
            PROJECT_FLAG="-workspace iosApp/iosApp.xcworkspace"
          else
            PROJECT_FLAG="-project iosApp/iosApp.xcodeproj"
          fi

          # 自动获取 Scheme 并编译
          SCHEME=$(xcodebuild -list $PROJECT_FLAG | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          if [ -z "$SCHEME" ]; then SCHEME="iosApp"; fi
          echo "Building Scheme: $SCHEME"

          xcodebuild build $PROJECT_FLAG \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 封装为未签名 IPA
        run: |
          mkdir -p Payload
          # 寻找编译生成的 Release .app
          APP_PATH=$(find build/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr LeonMusic-unsigned.ipa Payload
          rm -rf Payload

      - name: 上传 IPA 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LeonMusic-Unsigned-IPA
          path: LeonMusic-unsigned.ipa
